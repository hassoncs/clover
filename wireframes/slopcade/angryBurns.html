<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Angry Burns - Wireframe</title><link rel="stylesheet" href="../shared.css">
<style>
.tower-block { background: linear-gradient(180deg, #8B4513, #5D3A1A); border-radius: 4px; }
.launcher { width: 40px; height: 60px; background: linear-gradient(180deg, #c0392b, #922b21); border-radius: 8px 8px 4px 4px; position: relative; }
.launcher-arm { position: absolute; top: -30px; left: 50%; transform: translateX(-50%) rotate(-45deg); width: 8px; height: 40px; background: #5D3A1A; border-radius: 4px; }
.trajectory { position: absolute; top: 20px; left: 60px; width: 200px; height: 100px; border: 2px dashed rgba(255,255,255,0.3); border-radius: 50%; border-bottom: none; }
</style>
</head>
<body>
<div class="phase-tabs"><div class="phase-tab phase-tab--active">1. Aim</div><div class="phase-tab">2. Launch</div><div class="phase-tab">3. Score</div></div>
<div class="screens">
<div class="screen">
  <div class="screen-label">Screen 1: Aim</div>
  <div class="wireframe" style="background: linear-gradient(180deg, #87CEEB 0%, #98FB98 60%, #5D3A1A 60%);">
    <div class="arcade-hud">
      <div class="arcade-hud__item"><div style="font-size: 12px; color: #ccc;">SCORE</div><div style="font-size: 20px;">12,450</div></div>
      <div class="arcade-hud__item"><div style="font-size: 12px; color: #ccc;">BIRDS</div><div style="font-size: 16px;">🐦🐦🐦</div></div>
    </div>
    <div class="main" style="padding-top: 60px; position: relative;">
      <div style="position: absolute; right: 40px; bottom: 80px; display: flex; flex-direction: column; gap: 4px;">
        <div class="tower-block" style="width: 30px; height: 20px;"></div>
        <div class="tower-block" style="width: 30px; height: 40px;"></div>
        <div class="tower-block" style="width: 30px; height: 20px;"></div>
        <div class="tower-block" style="width: 30px; height: 30px;"></div>
        <div style="width: 30px; height: 30px; background: #2ecc71; border-radius: 50%; display: flex; align-items: center; justify-content: center;">🐷</div>
      </div>
      <div style="position: absolute; left: 40px; bottom: 80px;">
        <div class="launcher"><div class="launcher-arm"><div style="position: absolute; top: -16px; left: -6px; font-size: 24px;">🐦</div></div></div>
      </div>
      <div class="trajectory"></div>
    </div>
    <div class="input-area" style="background: transparent; text-align: center;"><div style="color: rgba(255,255,255,0.5); font-size: 12px;">Drag to aim, release to fire!</div></div>
  </div>
</div>
<div class="screen">
  <div class="screen-label">Screen 2: In Flight</div>
  <div class="wireframe" style="background: linear-gradient(180deg, #87CEEB 0%, #98FB98 60%, #5D3A1A 60%);">
    <div class="arcade-hud"><div class="arcade-hud__item"><div style="font-size: 12px; color: #ccc;">SCORE</div><div style="font-size: 20px;">12,700</div></div></div>
    <div class="main" style="padding-top: 60px; position: relative;">
      <div style="position: absolute; top: 100px; left: 150px; font-size: 32px;">🐦</div>
      <div style="position: absolute; right: 30px; bottom: 100px;">
        <div style="width: 30px; height: 20px; background: #5D3A1A; opacity: 0.3;"></div>
        <div style="width: 30px; height: 30px; background: #2ecc71; border-radius: 50%; display: flex; align-items: center; justify-content: center;">🐷</div>
      </div>
    </div>
  </div>
</div>
<div class="screen">
  <div class="screen-label">Screen 3: Level Complete</div>
  <div class="wireframe">
    <div class="main winner">
      <div style="font-size: 48px; margin-bottom: 16px;">🎯</div><div style="font-size: 24px; font-weight: 700;">Level Complete!</div>
      <div class="card" style="margin-top: 16px; width: 200px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;"><div style="color: var(--color-text-muted);">Score</div><div style="font-weight: 700;">12,700</div></div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;"><div style="color: var(--color-text-muted);">Pigs Hit</div><div style="font-weight: 700;">3/3</div></div>
        <div style="display: flex; justify-content: space-between;"><div style="color: var(--color-text-muted);">Stars</div><div style="color: #f1c40f;">⭐⭐⭐</div></div>
      </div>
    </div>
    <div class="input-area"><button class="btn btn--primary btn--full">Next Level →</button></div>
  </div>
</div>
</div>
</body>
</html>
