<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Shader Rainbow - Wireframe</title><link rel="stylesheet" href="../shared.css">
<style>
.rainbow-wave { background: #000; border-radius: 8px; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
.wave-bar { width: 80%; height: 40px; background: linear-gradient(90deg, #ff0000, #ff8000, #ffff00, #00ff00, #00ffff, #0080ff, #8000ff); border-radius: 20px; animation: wave 1s ease-in-out infinite; }
@keyframes wave { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(1.2); } }
</style>
</head>
<body>
<div class="screens">
<div class="screen">
  <div class="screen-label">Rainbow Wave Shader</div>
  <div class="wireframe">
    <div class="header"><div><div class="header__title">Shader Rainbow</div><div class="header__subtitle">Rainbow Sine Wave</div></div></div>
    <div class="main">
      <div class="rainbow-wave"><div class="wave-bar"></div></div>
      <div style="text-align: center; color: var(--color-text-muted); font-size: 12px; margin-top: 8px;">Rainbow sine wave shader on entities. Tap to spawn more cubes!</div>
    </div>
  </div>
</div>
</div>
</body>
</html>
