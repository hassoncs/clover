<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tween Toggle Cube - Wireframe</title><link rel="stylesheet" href="../shared.css">
<style>
.tween-box { width: 80px; height: 80px; background: linear-gradient(135deg, var(--color-primary), var(--color-accent)); border-radius: 8px; transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
.tween-box--toggled { transform: translateX(100px) rotate(180deg); }
</style>
</head>
<body>
<div class="phase-tabs"><div class="phase-tab phase-tab--active">1. Demo</div></div>
<div class="screens">
<div class="screen">
  <div class="screen-label">Tween Animation Demo</div>
  <div class="wireframe">
    <div class="header"><div><div class="header__title">Tween Toggle Cube</div><div class="header__subtitle">Animation Test</div></div></div>
    <div class="main" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
      <div style="width: 100%; padding: 40px;"><div class="tween-box tween-box--toggled"></div></div>
      <div style="text-align: center; color: var(--color-text-muted); font-size: 12px; margin-top: 16px;">Tap Animate to move the cube. Tap again to move it back.</div>
    </div>
    <div class="input-area"><button class="btn btn--primary btn--full">Animate</button></div>
  </div>
</div>
</div>
</body>
</html>
