<text x="518" y="164" fill="#A1A1AA" font-family="monospace" font-size="16">function updateBall(dt) {'{'}</text>
<text x="548" y="198" fill="#A1A1AA" font-family="monospace" font-size="16">ball.vx += gravity.x * dt;</text>
<text x="548" y="232" fill="#A1A1AA" font-family="monospace" font-size="16">ball.vy += gravity.y * dt;</text>
<text x="548" y="266" fill="#A1A1AA" font-family="monospace" font-size="16">if (portal.hit(ball)) teleport(ball);</text>
