# See https://ccache.dev/manual/4.3.html#_configuration_options for details and available options

# Required sloppiness settings for Xcode/Clang compatibility
sloppiness = clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros

# Enable file cloning (faster cache, less disk space)
file_clone = true

# Enable depend mode for better caching with header dependencies
depend_mode = true

# Use inode cache for faster cache lookups
inode_cache = true

# Optional: Enable debug logging if needed
# log_file = /tmp/ccache.log
