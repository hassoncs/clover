name: Deploy Landing Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-landing.yml'
      - 'apps/landing-slopcade/**'
      - 'apps/landing-amen/**'
      - 'apps/landing-slopbox/**'
      - 'packages/theme/**'
      - 'packages/ui/**'

jobs:
  detect-changes:
    name: Detect Landing Changes
    runs-on: ubuntu-latest
    outputs:
      slopcade: ${{ steps.filter.outputs.slopcade }}
      amen: ${{ steps.filter.outputs.amen }}
      slopbox: ${{ steps.filter.outputs.slopbox }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            slopcade:
              - 'apps/landing-slopcade/**'
              - 'packages/theme/**'
              - 'packages/ui/**'
              - '.github/workflows/deploy-landing.yml'
            amen:
              - 'apps/landing-amen/**'
              - 'packages/theme/**'
              - 'packages/ui/**'
              - '.github/workflows/deploy-landing.yml'
            slopbox:
              - 'apps/landing-slopbox/**'
              - 'packages/theme/**'
              - 'packages/ui/**'
              - '.github/workflows/deploy-landing.yml'

  deploy-slopcade-landing:
    name: Deploy Slopcade Landing
    needs: detect-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.slopcade == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm build
        working-directory: apps/landing-slopcade

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=slopcade-landing --commit-dirty=true
          workingDirectory: apps/landing-slopcade

  deploy-amen-landing:
    name: Deploy Amen Landing
    needs: detect-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.amen == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm build
        working-directory: apps/landing-amen

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=amen-landing --commit-dirty=true
          workingDirectory: apps/landing-amen

  deploy-slopbox-landing:
    name: Deploy Slopbox Landing
    needs: detect-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.slopbox == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm build
        working-directory: apps/landing-slopbox

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=slopbox-landing --commit-dirty=true
          workingDirectory: apps/landing-slopbox
