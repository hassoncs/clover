name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: TypeScript (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [slopcade, amen]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Typecheck ${{ matrix.app }}
        run: pnpm --filter @slopcade/${{ matrix.app }}-app exec tsc --noEmit

  test:
    name: Tests (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [slopcade, amen]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Test ${{ matrix.app }}
        run: pnpm --filter @slopcade/${{ matrix.app }}-app exec vitest run
        # Pre-existing failures in MicButton.test.tsx are expected
        continue-on-error: true

  test-packages:
    name: Test Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter './packages/*' run build --if-present

      - name: Test packages
        run: pnpm --filter './packages/*' exec vitest run --if-present
        continue-on-error: true
