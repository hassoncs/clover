name: Bridge Contract Validation

on:
  push:
    branches: [main, develop]
    paths:
      - 'scripts/bridge-codegen.ts'
      - 'godot_project/scripts/GameBridge.gd'
      - 'app/lib/godot/**'
      - 'packages/shared/src/godot/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'scripts/bridge-codegen.ts'
      - 'godot_project/scripts/GameBridge.gd'
      - 'app/lib/godot/**'
      - 'packages/shared/src/godot/**'

jobs:
  bridge-generation-drift:
    name: Bridge Generation Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.0.0
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Regenerate bridge artifacts
        run: pnpm generate:bridge
        
      - name: Check for generation drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: Bridge artifacts are out of sync with source"
            echo "Changed files:"
            git status --porcelain
            echo ""
            echo "Run 'pnpm generate:bridge' locally and commit the changes"
            exit 1
          fi
          echo "✓ Bridge artifacts are up to date"

  typescript-contract-validation:
    name: TypeScript Contract Validation
    runs-on: ubuntu-latest
    needs: bridge-generation-drift
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.0.0
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Type-level verification
        run: pnpm tsc --noEmit

  legacy-seam-detection:
    name: Legacy Seam Detection
    runs-on: ubuntu-latest
    needs: typescript-contract-validation
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for legacy seams
        run: |
          echo "Checking for legacy manual seams..."
          
          # Check for structural_aliases in tests
          if grep -rn "structural_aliases" godot_project/tests/ --include="*.gd"; then
            echo "ERROR: Found legacy structural_aliases in tests"
            exit 1
          fi
          
          # Check for manual overrides in GameBridge.gd
          if grep -rn "var overrides = {" godot_project/scripts/GameBridge.gd; then
            echo "ERROR: Found legacy manual overrides in GameBridge.gd"
            exit 1
          fi
          
          echo "✓ No legacy seams detected"

  godot-contract-tests:
    name: Godot Contract Tests
    runs-on: ubuntu-latest
    needs: legacy-seam-detection
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          
      - name: Verify Godot installation
        run: godot --version
        
      - name: Run Godot contract tests
        run: ./godot_project/run_tests.sh
        env:
          GODOT_BIN: godot
