# GDScript Pre-commit Hooks
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # GDScript Toolkit
  - repo: https://github.com/Scony/godot-gdscript-toolkit
    rev: 4.5.0
    hooks:
      - id: gdlint
        name: gdlint
        description: "gdlint - linter for GDScript"
        entry: gdlint
        language: python
        language_version: python3
        require_serial: true
        types: [gdscript]
        files: ^godot_project/scripts/.*\.gd$
        args: [--config, godot_project/.gdlintrc]
      
      - id: gdformat
        name: gdformat
        description: "gdformat - formatter for GDScript"
        entry: gdformat
        language: python
        language_version: python3
        require_serial: true
        types: [gdscript]
        files: ^godot_project/scripts/.*\.gd$
